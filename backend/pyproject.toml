[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.104,<1",
  "SQLAlchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<3.3",
  "alembic>=1.14,<1.15",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.8", "mypy>=1.13", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL", "concurrency: real PostgreSQL lock test"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["airline_core/domain", "airline_core/application"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["airline_core"]
exclude = ["alembic"]

[tool.setuptools.packages.find]
include = ["airline_core*"]
