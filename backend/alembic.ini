[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg://airline:airline_local_only@localhost:54329/airline

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys =
[formatters]
keys = generic
[logger_root]
level = WARN
handlers =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
