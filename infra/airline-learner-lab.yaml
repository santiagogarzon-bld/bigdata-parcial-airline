AWSTemplateFormatVersion: '2010-09-09'
Description: Low-cost airline OLTP and analytical data layer for AWS Academy Learner Lab (us-east-1).
Parameters:
  OperatorCidr:
    Type: String
    Description: Your current public IPv4 CIDR in /32 form; SSH is never open globally
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/32$'
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: airline-demo-key
    Description: Existing EC2 key pair used for SSH; the stack never creates or changes keys
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-0b5358cc8c5df0b02
    Description: Amazon Linux 2023 x86_64 AMI verified in us-east-1 on 2026-09-10; override after rechecking
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.nano, t3.micro, t3.small]
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small]
  DBMasterUsername:
    Type: String
    Default: airline_admin
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,15}$'
  DBMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 41
    AllowedPattern: '^[^/@"\s]{16,41}$'
    ConstraintDescription: Use 16-41 non-whitespace characters, excluding slash, at sign, and double quote
  DBEngineVersion:
    Type: String
    Default: '16.10'
    Description: PostgreSQL minor version verified in us-east-1 on 2026-09-10; override after rechecking
  DBName:
    Type: String
    Default: airline_oltp
    AllowedPattern: '^[a-z][a-z0-9_]{0,62}$'
  AnalyticsDBName:
    Type: String
    Default: airline_analytics
    AllowedPattern: '^[a-z][a-z0-9_]{0,62}$'
  AnalyticsDBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small]
  AnalyticsDBMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 41
    AllowedPattern: '^[^/@"\s]{16,41}$'
    ConstraintDescription: Use 16-41 non-whitespace characters, excluding slash, at sign, and double quote
  AnalyticsScriptKey:
    Type: String
    Default: etl/analytics_job.py
    Description: Object key for the analytics ETL script in the stack-owned bucket
    AllowedPattern: '^[^/].*[^/]$'
  AnalyticsTempPrefix:
    Type: String
    Default: glue-temp/
    Description: Object prefix used by Glue for temporary Spark files
    AllowedPattern: '^[^/].*/$'
  GlueSourceCatalogName:
    Type: String
    Default: airline_oltp
    AllowedPattern: '^[a-z][a-z0-9_]{0,254}$'
  GlueAnalyticsCatalogName:
    Type: String
    Default: airline_analytics
    AllowedPattern: '^[a-z][a-z0-9_]{0,254}$'
  GlueRoleArn:
    Type: String
    Description: Existing AWS Academy LabRole ARN; no IAM role is created by this stack
    AllowedPattern: '^arn:[^:]+:iam::[0-9]{12}:role/.+$'
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - {Key: Name, Value: airline-vpc}
        - {Key: Project, Value: airline-oltp-mvp}
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: airline-igw}
        - {Key: Project, Value: airline-oltp-mvp}
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: {Ref: InternetGateway}
      VpcId: {Ref: VPC}
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: VPC}
      AvailabilityZone: {Fn::Select: [0, {Fn::GetAZs: ''}]}
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: airline-public-a}
        - {Key: Project, Value: airline-oltp-mvp}
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: VPC}
      AvailabilityZone: {Fn::Select: [0, {Fn::GetAZs: ''}]}
      CidrBlock: 10.42.10.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: airline-private-a}
        - {Key: Project, Value: airline-oltp-mvp}
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: VPC}
      AvailabilityZone: {Fn::Select: [1, {Fn::GetAZs: ''}]}
      CidrBlock: 10.42.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: airline-private-b}
        - {Key: Project, Value: airline-oltp-mvp}
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: {Ref: VPC}
      Tags:
        - {Key: Name, Value: airline-public-rt}
        - {Key: Project, Value: airline-oltp-mvp}
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: {Ref: PublicRouteTable}
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: {Ref: InternetGateway}
  PublicRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: {Ref: PublicRouteTable}
      SubnetId: {Ref: PublicSubnet}
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: {Ref: VPC}
      Tags:
        - {Key: Name, Value: airline-private-rt}
        - {Key: Project, Value: airline-oltp-mvp}
  PrivateRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: {Ref: PrivateRouteTable}
      SubnetId: {Ref: PrivateSubnetA}
  PrivateRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: {Ref: PrivateRouteTable}
      SubnetId: {Ref: PrivateSubnetB}
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: {Ref: VPC}
      ServiceName: {Fn::Sub: 'com.amazonaws.${AWS::Region}.s3'}
      VpcEndpointType: Gateway
      RouteTableIds: [{Ref: PrivateRouteTable}]
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP demo port and operator-only SSH for airline API
      VpcId: {Ref: VPC}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: {Ref: OperatorCidr}
      Tags:
        - {Key: Name, Value: airline-api-sg}
        - {Key: Project, Value: airline-oltp-mvp}
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL only from airline API security group
      VpcId: {Ref: VPC}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: {Ref: ApiSecurityGroup}
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: {Ref: GlueSecurityGroup}
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: {Ref: AnalyticsDBSecurityGroup}
      Tags:
        - {Key: Name, Value: airline-db-sg}
        - {Key: Project, Value: airline-oltp-mvp}
  AnalyticsDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Analytical PostgreSQL only from Glue and operator bastion
      VpcId: {Ref: VPC}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: {Ref: GlueSecurityGroup}
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: {Ref: ApiSecurityGroup}
      Tags:
        - {Key: Name, Value: airline-analytics-db-sg}
        - {Key: Project, Value: airline-analytics}
  GlueSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Glue ENIs can reach PostgreSQL for analytics extraction and load
      VpcId: {Ref: VPC}
      Tags:
        - {Key: Name, Value: airline-glue-sg}
        - {Key: Project, Value: airline-analytics}
  GlueSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {Ref: GlueSecurityGroup}
      SourceSecurityGroupId: {Ref: GlueSecurityGroup}
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated private subnets for airline PostgreSQL
      SubnetIds: [{Ref: PrivateSubnetA}, {Ref: PrivateSubnetB}]
      Tags:
        - {Key: Name, Value: airline-db-subnets}
        - {Key: Project, Value: airline-oltp-mvp}
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBName: {Ref: DBName}
      DBInstanceClass: {Ref: DBInstanceClass}
      Engine: postgres
      EngineVersion: {Ref: DBEngineVersion}
      AllocatedStorage: '20'
      StorageType: gp3
      MasterUsername: {Ref: DBMasterUsername}
      MasterUserPassword: {Ref: DBMasterPassword}
      DBSubnetGroupName: {Ref: DBSubnetGroup}
      VPCSecurityGroups: [{Ref: DBSecurityGroup}]
      PubliclyAccessible: false
      MultiAZ: false
      MonitoringInterval: 0
      BackupRetentionPeriod: 1
      DeletionProtection: false
      StorageEncrypted: true
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - {Key: Name, Value: airline-db}
        - {Key: Project, Value: airline-oltp-mvp}
  AnalyticsDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBName: {Ref: AnalyticsDBName}
      DBInstanceClass: {Ref: AnalyticsDBInstanceClass}
      Engine: postgres
      EngineVersion: {Ref: DBEngineVersion}
      AllocatedStorage: '20'
      StorageType: gp3
      MasterUsername: {Ref: DBMasterUsername}
      MasterUserPassword: {Ref: AnalyticsDBMasterPassword}
      DBSubnetGroupName: {Ref: DBSubnetGroup}
      VPCSecurityGroups: [{Ref: AnalyticsDBSecurityGroup}]
      PubliclyAccessible: false
      MultiAZ: false
      MonitoringInterval: 0
      BackupRetentionPeriod: 1
      DeletionProtection: false
      StorageEncrypted: true
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - {Key: Name, Value: airline-analytics-db}
        - {Key: Project, Value: airline-analytics}
  AnalyticsArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - {Key: Name, Value: airline-analytics-artifacts}
        - {Key: Project, Value: airline-analytics}
  GlueSourceCatalogDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: {Ref: AWS::AccountId}
      DatabaseInput:
        Name: {Ref: GlueSourceCatalogName}
        Description: Catalog metadata for the transactional PostgreSQL source
  GlueAnalyticsCatalogDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: {Ref: AWS::AccountId}
      DatabaseInput:
        Name: {Ref: GlueAnalyticsCatalogName}
        Description: Catalog metadata for the PostgreSQL analytics schema
  GlueSourceConnection:
    Type: AWS::Glue::Connection
    DependsOn: Database
    Properties:
      CatalogId: {Ref: AWS::AccountId}
      ConnectionInput:
        Name: airline-oltp-jdbc
        Description: JDBC connection from Glue private ENIs to the OLTP RDS database
        ConnectionType: JDBC
        ConnectionProperties:
          JDBC_CONNECTION_URL: {Fn::Sub: 'jdbc:postgresql://${Database.Endpoint.Address}:${Database.Endpoint.Port}/${DBName}?sslmode=require'}
          USERNAME: {Ref: DBMasterUsername}
          PASSWORD: {Ref: DBMasterPassword}
          JDBC_ENFORCE_SSL: 'true'
        PhysicalConnectionRequirements:
          AvailabilityZone: {Fn::Select: [0, {Fn::GetAZs: ''}]}
          SubnetId: {Ref: PrivateSubnetA}
          SecurityGroupIdList: [{Ref: GlueSecurityGroup}]
  GlueAnalyticsConnection:
    Type: AWS::Glue::Connection
    DependsOn: AnalyticsDatabase
    Properties:
      CatalogId: {Ref: AWS::AccountId}
      ConnectionInput:
        Name: airline-analytics-jdbc
        Description: JDBC connection from Glue to the independent analytical RDS instance
        ConnectionType: JDBC
        ConnectionProperties:
          JDBC_CONNECTION_URL: {Fn::Sub: 'jdbc:postgresql://${AnalyticsDatabase.Endpoint.Address}:${AnalyticsDatabase.Endpoint.Port}/${AnalyticsDBName}?sslmode=require'}
          USERNAME: {Ref: DBMasterUsername}
          PASSWORD: {Ref: AnalyticsDBMasterPassword}
          JDBC_ENFORCE_SSL: 'true'
        PhysicalConnectionRequirements:
          AvailabilityZone: {Fn::Select: [0, {Fn::GetAZs: ''}]}
          SubnetId: {Ref: PrivateSubnetA}
          SecurityGroupIdList: [{Ref: GlueSecurityGroup}]
  GlueSourceCrawler:
    Type: AWS::Glue::Crawler
    DependsOn: [GlueSourceCatalogDatabase, GlueSourceConnection]
    Properties:
      Name: airline-oltp-crawler
      Role: {Ref: GlueRoleArn}
      DatabaseName: {Ref: GlueSourceCatalogName}
      Description: On-demand crawler for selected OLTP PostgreSQL tables
      Targets:
        JdbcTargets:
          - ConnectionName: airline-oltp-jdbc
            Path: {Fn::Sub: '${DBName}/public/reservations'}
          - ConnectionName: airline-oltp-jdbc
            Path: {Fn::Sub: '${DBName}/public/reservation_items'}
          - ConnectionName: airline-oltp-jdbc
            Path: {Fn::Sub: '${DBName}/public/payments'}
          - ConnectionName: airline-oltp-jdbc
            Path: {Fn::Sub: '${DBName}/public/refunds'}
          - ConnectionName: airline-oltp-jdbc
            Path: {Fn::Sub: '${DBName}/public/audit_events'}
          - ConnectionName: airline-oltp-jdbc
            Path: {Fn::Sub: '${DBName}/public/inventories'}
          - ConnectionName: airline-oltp-jdbc
            Path: {Fn::Sub: '${DBName}/public/flight_leg_instances'}
          - ConnectionName: airline-oltp-jdbc
            Path: {Fn::Sub: '${DBName}/public/flight_instances'}
          - ConnectionName: airline-oltp-jdbc
            Path: {Fn::Sub: '${DBName}/public/scheduled_flights'}
          - ConnectionName: airline-oltp-jdbc
            Path: {Fn::Sub: '${DBName}/public/scheduled_legs'}
          - ConnectionName: airline-oltp-jdbc
            Path: {Fn::Sub: '${DBName}/public/cabins'}
          - ConnectionName: airline-oltp-jdbc
            Path: {Fn::Sub: '${DBName}/public/agencies'}
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: DEPRECATE_IN_DATABASE
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_EVERYTHING
  GlueAnalyticsCrawler:
    Type: AWS::Glue::Crawler
    DependsOn: [GlueAnalyticsCatalogDatabase, GlueAnalyticsConnection]
    Properties:
      Name: airline-analytics-crawler
      Role: {Ref: GlueRoleArn}
      DatabaseName: {Ref: GlueAnalyticsCatalogName}
      Description: On-demand crawler for the analytics PostgreSQL schema
      Targets:
        JdbcTargets:
          - ConnectionName: airline-analytics-jdbc
            Path: {Fn::Sub: '${AnalyticsDBName}/analytics/%'}
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: DEPRECATE_IN_DATABASE
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_EVERYTHING
  GlueAnalyticsJob:
    Type: AWS::Glue::Job
    DependsOn: [GlueSourceConnection, GlueAnalyticsConnection]
    Properties:
      Name: airline-analytics-etl
      Description: On-demand Spark ETL from OLTP PostgreSQL into the analytics schema
      Role: {Ref: GlueRoleArn}
      GlueVersion: '4.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 30
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Connections:
        Connections:
          - airline-oltp-jdbc
          - airline-analytics-jdbc
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: {Fn::Sub: 's3://${AnalyticsArtifactsBucket}/${AnalyticsScriptKey}'}
      DefaultArguments:
        '--job-language': python
        '--TempDir': {Fn::Sub: 's3://${AnalyticsArtifactsBucket}/${AnalyticsTempPrefix}'}
        '--enable-job-insights': 'true'
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--source_connection_name': airline-oltp-jdbc
        '--target_connection_name': airline-analytics-jdbc
        '--source_catalog_database': {Ref: GlueSourceCatalogName}
        '--target_catalog_database': {Ref: GlueAnalyticsCatalogName}
        '--target_schema': analytics
  GlueAnalyticsHourlyTrigger:
    Type: AWS::Glue::Trigger
    DependsOn: GlueAnalyticsJob
    Properties:
      Name: airline-analytics-etl-hourly
      Type: SCHEDULED
      Schedule: cron(0 * * * ? *)
      # The deployment script activates it only after the Glue script exists in S3.
      StartOnCreation: false
      Description: Activated hourly scheduler for the analytics ETL job at minute 0 UTC
      Actions:
        - JobName: airline-analytics-etl
  ApiInstance:
    Type: AWS::EC2::Instance
    DependsOn: PublicDefaultRoute
    Properties:
      ImageId: {Ref: AmiId}
      InstanceType: {Ref: InstanceType}
      KeyName: {Ref: KeyName}
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId: {Ref: PublicSubnet}
          GroupSet: [{Ref: ApiSecurityGroup}]
      Tags:
        - {Key: Name, Value: airline-api}
        - {Key: Project, Value: airline-oltp-mvp}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eu
          if ! command -v docker >/dev/null 2>&1; then
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y docker
            elif command -v yum >/dev/null 2>&1; then
              yum install -y docker
            else
              echo 'Unsupported AMI: Docker package manager not found' >&2
              exit 1
            fi
          fi
          systemctl enable --now docker
          usermod -aG docker ec2-user
          install -d -m 0750 /opt/airline
          chown ec2-user:ec2-user /opt/airline || true
          echo 'Transfer the image and provide DATABASE_URL out of band.' > /opt/airline/README
Outputs:
  VpcId: {Value: {Ref: VPC}}
  PublicSubnetId: {Value: {Ref: PublicSubnet}}
  PrivateSubnetAId: {Value: {Ref: PrivateSubnetA}}
  PrivateSubnetBId: {Value: {Ref: PrivateSubnetB}}
  ApiInstanceId: {Value: {Ref: ApiInstance}}
  ApiPublicAddress: {Value: {Fn::GetAtt: [ApiInstance, PublicIp]}}
  DatabaseEndpoint: {Value: {Fn::GetAtt: [Database, Endpoint.Address]}}
  DatabaseIdentifier: {Value: {Ref: Database}}
  DatabasePort: {Value: {Fn::GetAtt: [Database, Endpoint.Port]}}
  AnalyticsDatabaseEndpoint: {Value: {Fn::GetAtt: [AnalyticsDatabase, Endpoint.Address]}}
  AnalyticsDatabaseIdentifier: {Value: {Ref: AnalyticsDatabase}}
  AnalyticsDatabasePort: {Value: {Fn::GetAtt: [AnalyticsDatabase, Endpoint.Port]}}
  GlueSourceCatalogDatabaseName: {Value: {Ref: GlueSourceCatalogName}}
  GlueAnalyticsCatalogDatabaseName: {Value: {Ref: GlueAnalyticsCatalogName}}
  GlueAnalyticsJobName: {Value: {Ref: GlueAnalyticsJob}}
  GlueAnalyticsTriggerName: {Value: {Ref: GlueAnalyticsHourlyTrigger}}
  AnalyticsArtifactsBucketName: {Value: {Ref: AnalyticsArtifactsBucket}}
  AnalyticsScriptS3Uri:
    Value: {Fn::Sub: 's3://${AnalyticsArtifactsBucket}/${AnalyticsScriptKey}'}
