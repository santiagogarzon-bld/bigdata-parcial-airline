AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated low-cost airline OLTP demo for AWS Academy Learner Lab (us-east-1).
Parameters:
  OperatorCidr:
    Type: String
    Description: Your current public IPv4 CIDR in /32 form; SSH is never open globally
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/32$'
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey
    Description: Existing EC2 key pair used for SSH; the stack never creates or changes keys
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-0b5358cc8c5df0b02
    Description: Amazon Linux 2023 x86_64 AMI verified in us-east-1 on 2026-09-10; override after rechecking
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.nano, t3.micro, t3.small]
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small]
  DBMasterUsername:
    Type: String
    Default: airline_admin
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,15}$'
  DBMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 41
    AllowedPattern: '^[^/@"\s]{16,41}$'
    ConstraintDescription: Use 16-41 non-whitespace characters, excluding slash, at sign, and double quote
  DBEngineVersion:
    Type: String
    Default: '16.10'
    Description: PostgreSQL minor version verified in us-east-1 on 2026-09-10; override after rechecking
  DBName:
    Type: String
    Default: airline_oltp
    AllowedPattern: '^[a-z][a-z0-9_]{0,62}$'
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - {Key: Name, Value: airline-vpc}
        - {Key: Project, Value: airline-oltp-mvp}
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: airline-igw}
        - {Key: Project, Value: airline-oltp-mvp}
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: {Ref: InternetGateway}
      VpcId: {Ref: VPC}
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: VPC}
      AvailabilityZone: {Fn::Select: [0, {Fn::GetAZs: ''}]}
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: airline-public-a}
        - {Key: Project, Value: airline-oltp-mvp}
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: VPC}
      AvailabilityZone: {Fn::Select: [0, {Fn::GetAZs: ''}]}
      CidrBlock: 10.42.10.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: airline-private-a}
        - {Key: Project, Value: airline-oltp-mvp}
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: VPC}
      AvailabilityZone: {Fn::Select: [1, {Fn::GetAZs: ''}]}
      CidrBlock: 10.42.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: airline-private-b}
        - {Key: Project, Value: airline-oltp-mvp}
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: {Ref: VPC}
      Tags:
        - {Key: Name, Value: airline-public-rt}
        - {Key: Project, Value: airline-oltp-mvp}
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: {Ref: PublicRouteTable}
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: {Ref: InternetGateway}
  PublicRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: {Ref: PublicRouteTable}
      SubnetId: {Ref: PublicSubnet}
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: {Ref: VPC}
      Tags:
        - {Key: Name, Value: airline-private-rt}
        - {Key: Project, Value: airline-oltp-mvp}
  PrivateRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: {Ref: PrivateRouteTable}
      SubnetId: {Ref: PrivateSubnetA}
  PrivateRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: {Ref: PrivateRouteTable}
      SubnetId: {Ref: PrivateSubnetB}
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP demo port and operator-only SSH for airline API
      VpcId: {Ref: VPC}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: {Ref: OperatorCidr}
      Tags:
        - {Key: Name, Value: airline-api-sg}
        - {Key: Project, Value: airline-oltp-mvp}
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL only from airline API security group
      VpcId: {Ref: VPC}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: {Ref: ApiSecurityGroup}
      Tags:
        - {Key: Name, Value: airline-db-sg}
        - {Key: Project, Value: airline-oltp-mvp}
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated private subnets for airline PostgreSQL
      SubnetIds: [{Ref: PrivateSubnetA}, {Ref: PrivateSubnetB}]
      Tags:
        - {Key: Name, Value: airline-db-subnets}
        - {Key: Project, Value: airline-oltp-mvp}
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBName: {Ref: DBName}
      DBInstanceClass: {Ref: DBInstanceClass}
      Engine: postgres
      EngineVersion: {Ref: DBEngineVersion}
      AllocatedStorage: '20'
      StorageType: gp3
      MasterUsername: {Ref: DBMasterUsername}
      MasterUserPassword: {Ref: DBMasterPassword}
      DBSubnetGroupName: {Ref: DBSubnetGroup}
      VPCSecurityGroups: [{Ref: DBSecurityGroup}]
      PubliclyAccessible: false
      MultiAZ: false
      MonitoringInterval: 0
      BackupRetentionPeriod: 1
      DeletionProtection: false
      StorageEncrypted: true
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - {Key: Name, Value: airline-db}
        - {Key: Project, Value: airline-oltp-mvp}
  ApiInstance:
    Type: AWS::EC2::Instance
    DependsOn: PublicDefaultRoute
    Properties:
      ImageId: {Ref: AmiId}
      InstanceType: {Ref: InstanceType}
      KeyName: {Ref: KeyName}
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId: {Ref: PublicSubnet}
          GroupSet: [{Ref: ApiSecurityGroup}]
      Tags:
        - {Key: Name, Value: airline-api}
        - {Key: Project, Value: airline-oltp-mvp}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eu
          if ! command -v docker >/dev/null 2>&1; then
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y docker
            elif command -v yum >/dev/null 2>&1; then
              yum install -y docker
            else
              echo 'Unsupported AMI: Docker package manager not found' >&2
              exit 1
            fi
          fi
          systemctl enable --now docker
          usermod -aG docker ec2-user
          install -d -m 0750 /opt/airline
          chown ec2-user:ec2-user /opt/airline || true
          echo 'Transfer the image and provide DATABASE_URL out of band.' > /opt/airline/README
Outputs:
  VpcId: {Value: {Ref: VPC}}
  PublicSubnetId: {Value: {Ref: PublicSubnet}}
  PrivateSubnetAId: {Value: {Ref: PrivateSubnetA}}
  PrivateSubnetBId: {Value: {Ref: PrivateSubnetB}}
  ApiInstanceId: {Value: {Ref: ApiInstance}}
  ApiPublicAddress: {Value: {Fn::GetAtt: [ApiInstance, PublicIp]}}
  DatabaseEndpoint: {Value: {Fn::GetAtt: [Database, Endpoint.Address]}}
  DatabaseIdentifier: {Value: {Ref: Database}}
  DatabasePort: {Value: {Fn::GetAtt: [Database, Endpoint.Port]}}
